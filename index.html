/* ============================================================
   SpeakUp! – Interactive English Speaking Courseware
   ============================================================ */

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const app = () => $('#app');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => {a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const photo = (tag,lock) => `https://loremflickr.com/480/360/${encodeURIComponent(tag)}?lock=${lock}`;
const ph = emoji => `data:image/svg+xml;utf8,`+encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0e7ff"/><stop offset="1" stop-color="#bae6fd"/></linearGradient></defs><rect width="480" height="360" fill="url(#g)"/><text x="50%" y="58%" font-size="140" text-anchor="middle">${emoji}</text></svg>`);
const imgTag = (tag,lock,emoji,cls='') =>
  `<img src="${photo(tag,lock)}" onerror="this.onerror=null;this.src='${ph(emoji)}'" loading="lazy" alt="${esc(tag)}" class="${cls}">`;

/* ---------- Text to Speech ---------- */
let VOICE=null;
function loadVoices(){
  const v = speechSynthesis.getVoices();
  VOICE = v.find(x=>/en-GB|en-US/.test(x.lang)&&/Google|Samantha|Karen|Natural/i.test(x.name))
       || v.find(x=>x.lang&&x.lang.startsWith('en')) || null;
}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}

/* ---------- Mobile keyboard fix: keep focused field / Start button visible ---------- */
function scrollFocusedIntoView(){
  const el=document.activeElement;
  if(el && (el.tagName==='INPUT'||el.tagName==='SELECT')){
    setTimeout(()=>el.scrollIntoView({block:'center',behavior:'smooth'}),50);
  }
}
document.addEventListener('focusin',scrollFocusedIntoView);
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',scrollFocusedIntoView);
}
/* Some in-app WebViews swallow the first "click" on a button right
   after the on-screen keyboard closes (the tap that dismisses the
   keyboard doesn't always also register as a click on what's under
   it). Handling touchend directly on the Start button, with a short
   lock to stop the follow-up synthetic click from firing it twice,
   makes the tap register reliably on the first try. */
let _startLock=false;
function startLessonTouch(e){
  e.preventDefault();
  if(_startLock) return false;
  _startLock=true;
  startLesson(null);
  setTimeout(()=>{_startLock=false;},700);
  return false;
}
function speak(text,rate=.92,done){
  if(!('speechSynthesis' in window)){alert('Sorry, your browser does not support audio playback.');return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';u.rate=rate;u.pitch=1;if(VOICE)u.voice=VOICE;
  if(done)u.onend=done;
  speechSynthesis.speak(u);
}
function stopSpeak(){if('speechSynthesis' in window)speechSynthesis.cancel();}

const state = {view:'login', student:null, topic:null, scores:{}};
const key = s => `speakup_${s.name}_${s.cls}_${s.no}`.replace(/\s+/g,'_');
function saveScores(){ if(state.student) localStorage.setItem(key(state.student), JSON.stringify(state.scores)); }
function loadScores(){ try{ state.scores = JSON.parse(localStorage.getItem(key(state.student))||'{}'); }catch(e){ state.scores={}; } }
function setScore(tid,step,score,total){
  state.scores[tid]=state.scores[tid]||{};
  const prev=state.scores[tid][step];
  if(!prev||score>prev.score) state.scores[tid][step]={score,total};
  saveScores();
}
const getScore=(tid,step)=>(state.scores[tid]||{})[step];
function topicProgress(tid){ let done=0; for(let s=1;s<=3;s++){const r=getScore(tid,s); if(r&&r.score/r.total>=.6)done++;} return done; }
function totalStars(){ return DATA.reduce((n,t)=>n+topicProgress(t.id),0); }

function startLesson(e){
  // ป้องกัน error ในกรณีที่ฟังก์ชันถูกเรียกด้วย event
  if(e && typeof e.preventDefault === 'function') e.preventDefault();
  
  // ดึงข้อมูลจากช่องกรอก
  let name = $('#inName').value.trim();
  let cls = $('#inClass').value;
  let no = $('#inNo').value;
  
  // ถ้าช่องกรอกว่างเปล่า ให้ใส่ค่าเริ่มต้นแทนการแจ้งเตือน
  if(!name) name = "Guest (ผู้เยี่ยมชม)";
  if(!cls) cls = "-";
  if(!no) no = "-";
  
  // บันทึกข้อมูลและเข้าสู่หน้าบทเรียนทันที
  state.student = {name: name, cls: cls, no: no};
  loadScores(); 
  go('home');
}

/* ============================================================
   QUIZ ENGINE
   ============================================================ */
function pick3(arr,notIdx,field){ return shuffle(arr.map((x,i)=>i).filter(i=>i!==notIdx)).slice(0,3).map(i=>arr[i][field]); }
function build(correct,others,imgInfo,prompt){
  const choices=shuffle([correct,...others]);
  return {prompt,choices,a:choices.indexOf(correct),img:imgInfo||null};
}
function vocabQuiz(t){
  const ws=t.words;
  return shuffle(ws.map((w,i)=>i)).map((i,n)=>{
    const w=ws[i];
    if(n%2===0) return build(w.en,pick3(ws,i,'en'),{tag:w.tag,lock:300+i,e:w.e},'Look at the picture. What is it in English?');
    return build(w.th,pick3(ws,i,'th'),null,`What does <span class="text-brand-700">"${w.en}"</span> mean in Thai?`);
  });
}
function sentenceQuiz(t){
  const ss=t.sentences, qs=[];
  [0,2,4,6,8].forEach(i=>{
    const s=ss[i];
    const gap=s.en.replace(new RegExp(s.k,'i'),'<span class="px-6 border-b-2 border-brand-400 inline-block"></span>');
    qs.push(build(s.k,pick3(ss,i,'k'),null,`Choose the correct word: <br><span class="text-slate-800">${gap}</span>`));
  });
  [1,3,5,7,9].forEach(i=>{
    const s=ss[i];
    qs.push(build(s.en,pick3(ss,i,'en'),null,`Which English sentence means:<br><span lang="th" class="text-brand-700">"${s.th}"</span>`));
  });
  return shuffle(qs);
}
function dialogueQuiz(t){ return t.dialogue.quiz.map(q=>({prompt:q.q,choices:q.c,a:q.a,img:null})); }

let QZ=null;
function testView(t,step){
  QZ={t,step,qs:step===1?vocabQuiz(t):step===2?sentenceQuiz(t):dialogueQuiz(t),i:0,score:0,answered:false};
  return quizBody();
}
function quizBody(){
  const {t,step,qs,i,score}=QZ, q=qs[i];
  return `
  <div class="mb-4 flex items-center gap-3">
    <button onclick="go('step',['${t.id}',${step}])" class="p-2 rounded-xl bg-white shadow text-brand-700">${ICO.back}</button>
    <div class="flex-1"><div class="h-2 bg-white rounded-full overflow-hidden shadow-inner"><div class="h-full bg-gradient-to-r from-brand-500 to-sky-400 transition-all" style="width:${i/qs.length*100}%"></div></div></div>
    <span class="font-black text-brand-900 text-sm">${i+1}/${qs.length}</span>
  </div>
  <div class="bg-white rounded-3xl shadow-soft p-5 sm:p-7 animate-pop">
    <p class="text-[11px] font-black uppercase tracking-wider text-brand-500">Step ${step} Test · ${t.name}</p>
    ${q.img?`<div class="mt-3 rounded-2xl overflow-hidden h-44 sm:h-56 bg-slate-100">${imgTag(q.img.tag,q.img.lock,q.img.e,'w-full h-full object-cover')}</div>`:''}
    <p class="mt-4 text-lg font-black text-slate-800 leading-snug">${q.prompt}</p>
    <div id="opts" class="mt-5 grid sm:grid-cols-2 gap-3">
      ${q.choices.map((c,n)=>`
      <button onclick="answer(${n})" data-n="${n}" class="opt text-left px-4 py-3.5 rounded-2xl border-2 border-slate-200 font-bold hover:border-brand-400 hover:bg-brand-50 active:scale-[.98] transition">
        <span class="inline-grid place-items-center w-7 h-7 rounded-lg bg-slate-100 text-slate-600 text-xs font-black mr-2">${'ABCD'[n]}</span>${c}
      </button>`).join('')}
    </div>
    <div id="fb" class="mt-4 hidden"></div>
    <div class="mt-5 flex justify-between items-center">
      <span class="text-sm font-bold text-slate-500">Score: <span class="text-brand-700">${score}</span></span>
      <button id="nextBtn" onclick="nextQ()" class="hidden px-5 py-3 rounded-2xl bg-brand-600 text-white font-black shadow active:scale-95">${iconBtn('Next',ICO.next)}</button>
    </div>
  </div>`;
}
function answer(n){
  if(QZ.answered)return; QZ.answered=true;
  const q=QZ.qs[QZ.i], ok=n===q.a;
  if(ok)QZ.score++;
  document.querySelectorAll('.opt').forEach(b=>{
    const k=+b.dataset.n; b.disabled=true;
    if(k===q.a)b.className='opt text-left px-4 py-3.5 rounded-2xl border-2 border-emerald-500 bg-emerald-50 font-bold';
    else if(k===n)b.className='opt text-left px-4 py-3.5 rounded-2xl border-2 border-rose-400 bg-rose-50 font-bold opacity-90';
    else b.className='opt text-left px-4 py-3.5 rounded-2xl border-2 border-slate-100 font-bold opacity-50';
  });
  const fb=$('#fb'); fb.classList.remove('hidden');
  fb.innerHTML= ok
    ? `<div class="rounded-2xl bg-emerald-50 text-emerald-800 px-4 py-3 font-bold">✅ Excellent! That is correct.</div>`
    : `<div class="rounded-2xl bg-rose-50 text-rose-800 px-4 py-3 font-bold">❌ Not quite. The correct answer is <b>${q.choices[q.a]}</b>.</div>`;
  if(/^[A-Za-z ,.'?!-]+$/.test(q.choices[q.a])) speak(q.choices[q.a],.9);
  $('#nextBtn').classList.remove('hidden');
}
function nextQ(){
  QZ.i++; QZ.answered=false;
  if(QZ.i>=QZ.qs.length){ finishQuiz(); return; }
  app().innerHTML=shell(quizBody(),QZ.t.id);
}
function finishQuiz(){
  const {t,step,qs,score}=QZ, total=qs.length, pct=Math.round(score/total*100), pass=pct>=60;
  setScore(t.id,step,score,total);
  const msg = pct===100?'Perfect! You are an English star! 🌟' : pass?'Well done! Keep practising your speaking.' : 'Good try! Review the lesson and test again.';
  app().innerHTML=shell(`
  <div class="bg-white rounded-3xl shadow-soft p-7 text-center animate-pop max-w-lg mx-auto">
    <div class="text-6xl">${pass?'🎉':'💪'}</div>
    <h2 class="mt-2 text-2xl font-black text-brand-900">${pass?'You passed!':'Try again'}</h2>
    <p class="text-slate-500 font-semibold">${msg}</p>
    <div class="my-6 relative w-36 h-36 mx-auto grid place-items-center rounded-full" style="background:conic-gradient(${pass?'#6366f1':'#f59e0b'} ${pct*3.6}deg,#e2e8f0 0)">
      <div class="w-28 h-28 bg-white rounded-full grid place-items-center">
        <div><p class="text-3xl font-black text-brand-900">${pct}%</p><p class="text-xs font-bold text-slate-500">${score}/${total}</p></div>
      </div>
    </div>
    <div class="flex flex-wrap gap-2 justify-center">
      <button onclick="go('test',['${t.id}',${step}])" class="px-5 py-3 rounded-2xl bg-amber-400 text-amber-950 font-black shadow">🔁 Retake Test</button>
      <button onclick="go('step',['${t.id}',${step}])" class="px-5 py-3 rounded-2xl bg-white border-2 border-slate-200 font-black text-slate-600">${iconBtn('Back to Lesson',ICO.back)}</button>
      ${step<3?`<button onclick="go('step',['${t.id}',${step+1}])" class="px-5 py-3 rounded-2xl bg-brand-600 text-white font-black shadow">${iconBtn('Next Step',ICO.next)}</button>`
              :`<button onclick="go('roleplay','${t.id}')" class="px-5 py-3 rounded-2xl bg-fuchsia-500 text-white font-black shadow">${iconBtn('Role-play',ICO.mic)}</button>`}
    </div>
  </div>`,t.id);
}

/* ============================================================
   ROLE-PLAY
   ============================================================ */
let RP=null;
function roleplayView(t){
  RP={t,role:null,i:0,results:[]};
  return `
  <button onclick="go('step',['${t.id}',3])" class="mb-4 px-3 py-1.5 rounded-xl bg-white shadow font-bold text-xs text-brand-700">${iconBtn('Back to Lesson',ICO.back)}</button>
  <div class="bg-white rounded-3xl shadow-soft p-6 text-center max-w-lg mx-auto animate-pop">
    <p class="text-4xl">🎭</p>
    <h2 class="text-xl font-black text-brand-900 mt-1">Role-play: ${t.dialogue.title}</h2>
    <p class="text-sm text-slate-500 font-semibold mt-1">Choose your character. The app will speak the other person's lines, and you speak yours.</p>
    <div class="mt-5 grid sm:grid-cols-2 gap-3">
      <button onclick="startRP('A')" class="p-5 rounded-2xl border-2 border-brand-200 bg-brand-50 font-black text-brand-800 active:scale-95">🧑‍💼<br>${t.dialogue.roleA}</button>
      <button onclick="startRP('B')" class="p-5 rounded-2xl border-2 border-emerald-200 bg-emerald-50 font-black text-emerald-800 active:scale-95">🧑‍🎓<br>${t.dialogue.roleB}</button>
    </div>
    <p class="mt-4 text-[11px] text-slate-400">Tip: allow microphone access to get a pronunciation score (Chrome recommended).</p>
  </div>`;
}
function startRP(role){ RP.role=role; RP.i=0; RP.results=[]; renderRP(); }
function renderRP(){
  const {t,role,i}=RP, d=t.dialogue;
  if(i>=d.lines.length){ return rpFinish(); }
  const l=d.lines[i], mine=l.r===role;
  app().innerHTML=shell(`
  <div class="mb-4 flex items-center gap-3">
    <button onclick="go('step',['${t.id}',3])" class="p-2 rounded-xl bg-white shadow text-brand-700">${ICO.back}</button>
    <div class="flex-1"><div class="h-2 bg-white rounded-full overflow-hidden"><div class="h-full bg-fuchsia-500 transition-all" style="width:${i/d.lines.length*100}%"></div></div></div>
    <span class="font-black text-sm text-brand-900">${i+1}/${d.lines.length}</span>
  </div>
  <div class="bg-white rounded-3xl shadow-soft p-6 max-w-lg mx-auto text-center animate-pop">
    <p class="text-[11px] font-black uppercase tracking-wider ${mine?'text-emerald-600':'text-brand-500'}">${mine?'YOUR TURN – speak now':'Listen to '+(l.r==='A'?d.roleA:d.roleB)}</p>
    <p class="text-5xl my-3">${mine?'🎤':'🔊'}</p>
    <p class="text-lg font-black text-slate-800 leading-snug">${l.en}</p>
    <p class="text-sm text-slate-500 font-semibold mt-1" lang="th">${l.th}</p>
    <div id="rpFb" class="mt-4"></div>
    <div class="mt-5 flex flex-wrap gap-2 justify-center">
      <button onclick="speak(this.dataset.t)" data-t="${esc(l.en)}" class="px-4 py-3 rounded-2xl bg-brand-50 text-brand-700 font-black">${iconBtn('Listen',ICO.sound)}</button>
      ${mine?`<button id="recBtn" onclick="recordRP()" class="px-5 py-3 rounded-2xl bg-fuchsia-500 text-white font-black shadow">${iconBtn('Speak',ICO.mic)}</button>
              <button onclick="rpNext(null)" class="px-4 py-3 rounded-2xl bg-white border-2 border-slate-200 font-black text-slate-600">Skip ▶</button>`
             :`<button onclick="rpNext(null)" class="px-5 py-3 rounded-2xl bg-brand-600 text-white font-black shadow">${iconBtn('Next',ICO.next)}</button>`}
    </div>
  </div>`,t.id);
  if(!mine) speak(l.en,.9);
}
function norm(s){return s.toLowerCase().replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim();}
function similarity(said,target){
  const a=norm(said).split(' ').filter(Boolean), b=new Set(norm(target).split(' ').filter(Boolean));
  if(!a.length)return 0; let hit=0; a.forEach(w=>{if(b.has(w))hit++;});
  return Math.round(hit/Math.max(b.size,1)*100);
}
function recordRP(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const fb=$('#rpFb');
  if(!SR){ fb.innerHTML='<div class="rounded-2xl bg-amber-50 text-amber-800 px-4 py-3 font-bold text-sm">🎙️ Your browser cannot record speech. Say the sentence aloud, then press Skip ▶ to continue.</div>'; return; }
  const r=new SR(); r.lang='en-US'; r.interimResults=false; r.maxAlternatives=1;
  $('#recBtn').innerHTML='🔴 Listening...';
  fb.innerHTML='<p class="text-sm font-bold text-fuchsia-600 animate-pulse">Listening… speak clearly!</p>';
  r.onresult=e=>{
    const said=e.results[0][0].transcript, sc=similarity(said,RP.t.dialogue.lines[RP.i].en);
    fb.innerHTML=`<div class="rounded-2xl ${sc>=70?'bg-emerald-50 text-emerald-800':'bg-amber-50 text-amber-800'} px-4 py-3 font-bold text-sm">
      You said: "${esc(said)}"<br>Pronunciation match: <b>${sc}%</b> ${sc>=70?'👏 Great job!':'🙂 Try once more!'}</div>`;
    $('#recBtn').innerHTML=iconBtn('Try again',ICO.mic);
    setTimeout(()=>rpNext(sc),1400);
  };
  r.onerror=()=>{ fb.innerHTML='<div class="rounded-2xl bg-rose-50 text-rose-700 px-4 py-3 font-bold text-sm">Microphone error. Please check permission or press Skip ▶.</div>'; $('#recBtn').innerHTML=iconBtn('Speak',ICO.mic); };
  r.start();
}
function rpNext(score){ if(score!=null)RP.results.push(score); RP.i++; stopSpeak(); renderRP(); }
function rpFinish(){
  const avg=RP.results.length?Math.round(RP.results.reduce((a,b)=>a+b,0)/RP.results.length):null;
  app().innerHTML=shell(`
  <div class="bg-white rounded-3xl shadow-soft p-7 text-center max-w-lg mx-auto animate-pop">
    <p class="text-6xl">🏆</p>
    <h2 class="text-2xl font-black text-brand-900 mt-2">Role-play Completed!</h2>
    <p class="text-slate-500 font-semibold">${avg!=null?`Average pronunciation match: <b class="text-brand-700">${avg}%</b>`:'You practised the whole conversation. Well done!'}</p>
    <div class="mt-6 flex gap-2 justify-center flex-wrap">
      <button onclick="go('roleplay','${RP.t.id}')" class="px-5 py-3 rounded-2xl bg-fuchsia-500 text-white font-black shadow">🔁 Practise Again</button>
      <button onclick="go('step',['${RP.t.id}',3])" class="px-5 py-3 rounded-2xl bg-white border-2 border-slate-200 font-black text-slate-600">${iconBtn('Back to Lesson',ICO.back)}</button>
      <button onclick="go('report')" class="px-5 py-3 rounded-2xl bg-brand-600 text-white font-black shadow">${iconBtn('My Report',ICO.chart)}</button>
    </div>
  </div>`,RP.t.id);
}

/* ============================================================
   REPORT
   ============================================================ */
function reportView(){
  const s=state.student;
  let got=0,max=0;
  const rows=DATA.map(t=>{
    const cells=[1,2,3].map(n=>{const r=getScore(t.id,n); if(r){got+=r.score;max+=r.total;}
      return r?`<td class="px-3 py-3 text-center font-bold ${r.score/r.total>=.6?'text-emerald-600':'text-amber-600'}">${r.score}/${r.total}</td>`
              :`<td class="px-3 py-3 text-center text-slate-300 font-bold">–</td>`;}).join('');
    return `<tr class="border-b border-slate-100"><td class="px-3 py-3 font-bold whitespace-nowrap">${t.icon} ${t.name}</td>${cells}<td class="px-3 py-3 text-center">${'⭐'.repeat(topicProgress(t.id))||'—'}</td></tr>`;
  }).join('');
  const pct=max?Math.round(got/max*100):0;
  return `
  <div class="bg-white rounded-3xl shadow-soft p-6">
    <div class="flex items-start justify-between gap-4 flex-wrap">
      <div>
        <h2 class="text-xl font-black text-brand-900">📊 Progress Report</h2>
        <p class="text-sm font-semibold text-slate-600">${esc(s.name)} · Class ${esc(s.cls)} · No. ${esc(s.no)}</p>
        <p class="text-xs text-slate-400">Course: English Speaking Skills for Lower Secondary Students</p>
      </div>
      <button onclick="window.print()" class="no-print px-4 py-2 rounded-xl bg-brand-600 text-white font-bold text-sm shadow">🖨️ Print</button>
    </div>
    <div class="mt-5 grid grid-cols-3 gap-3 text-center">
      <div class="rounded-2xl bg-brand-50 p-4"><p class="text-2xl font-black text-brand-700">${totalStars()}/15</p><p class="text-[11px] font-bold text-slate-500 uppercase">Stars</p></div>
      <div class="rounded-2xl bg-emerald-50 p-4"><p class="text-2xl font-black text-emerald-700">${got}/${max||0}</p><p class="text-[11px] font-bold text-slate-500 uppercase">Points</p></div>
      <div class="rounded-2xl bg-amber-50 p-4"><p class="text-2xl font-black text-amber-600">${pct}%</p><p class="text-[11px] font-bold text-slate-500 uppercase">Average</p></div>
    </div>
    <div class="mt-5 overflow-x-auto">
      <table class="w-full text-sm">
        <thead><tr class="bg-slate-50 text-slate-500 text-[11px] uppercase tracking-wide">
          <th class="px-3 py-2 text-left">Unit</th><th class="px-3 py-2">Step 1<br>Vocabulary</th><th class="px-3 py-2">Step 2<br>Sentences</th><th class="px-3 py-2">Step 3<br>Conversation</th><th class="px-3 py-2">Stars</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <p class="mt-4 text-xs text-slate-400">Pass criterion: 60% of each test. Only the best score of each test is recorded.</p>
  </div>`;
}

/* ============================================================
   ROUTER
   ============================================================ */
function go(view,arg){
  stopSpeak(); closeNav();
  state.view=view;
  if(view==='topic'){ state.topic=arg; }
  if(view==='step'||view==='test'){ state.topic=arg[0]; state.step=arg[1]; }
  if(view==='roleplay'){ state.topic=arg; }
  render(); window.scrollTo({top:0,behavior:'smooth'});
}
function render(){
  if(!state.student){ loginView(); return; }
  const t=DATA.find(x=>x.id===state.topic);
  switch(state.view){
    case 'home': app().innerHTML=shell(homeView(),null); break;
    case 'report': app().innerHTML=shell(reportView(),null); break;
    case 'topic': app().innerHTML=shell(topicView(t),t.id); break;
    case 'step': app().innerHTML=shell(state.step===1?step1View(t):state.step===2?step2View(t):step3View(t),t.id); break;
    case 'test': app().innerHTML=shell(testView(t,state.step),t.id); break;
    case 'roleplay': app().innerHTML=shell(roleplayView(t),t.id); break;
    default: loginView();
  }
}
render();
</script>
</body>
